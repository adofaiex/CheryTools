<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b0e12">
    <title>CheryTools · 赞助者</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #090b0f;
            --panel: rgba(20, 24, 31, .82);
            --panel-hover: rgba(28, 34, 43, .94);
            --line: rgba(255, 255, 255, .09);
            --text: #f1f4f8;
            --muted: #98a2b0;
            --accent: #83d9bd;
            --accent-strong: #4cbf9e;
            --danger: #ff8d8d;
            --radius: 18px;
        }

        * { box-sizing: border-box; }

        html, body { min-height: 100%; }

        body {
            margin: 0;
            color: var(--text);
            background:
                radial-gradient(circle at 20% 0%, rgba(62, 139, 119, .15), transparent 35rem),
                radial-gradient(circle at 100% 100%, rgba(62, 89, 139, .12), transparent 32rem),
                var(--bg);
            font-family: "MiSans", "Microsoft YaHei", "Segoe UI", sans-serif;
            letter-spacing: .01em;
        }

        a { color: inherit; text-decoration: none; }

        .shell {
            width: min(1080px, calc(100% - 40px));
            margin: 0 auto;
            padding: 56px 0 72px;
        }

        .hero { margin-bottom: 42px; }

        .eyebrow {
            margin: 0 0 14px;
            color: var(--accent);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .16em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(34px, 6vw, 64px);
            line-height: 1.04;
            letter-spacing: -.045em;
        }

        .hero p {
            max-width: 680px;
            margin: 18px 0 0;
            color: var(--muted);
            font-size: 16px;
            line-height: 1.8;
        }

        .section-head {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 16px;
        }

        h2 { margin: 0; font-size: 22px; letter-spacing: -.02em; }

        .section-note { color: var(--muted); font-size: 13px; }

        .sponsor-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
        }

        .sponsor-card {
            display: flex;
            min-height: 156px;
            flex-direction: column;
            justify-content: space-between;
            padding: 22px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--panel);
            box-shadow: 0 18px 60px rgba(0, 0, 0, .18);
            transition: border-color .18s ease, background .18s ease, transform .18s ease;
        }

        .sponsor-card:hover {
            border-color: rgba(131, 217, 189, .34);
            background: var(--panel-hover);
            transform: translateY(-2px);
        }

        .sponsor-name { font-size: 18px; font-weight: 700; }
        .sponsor-uid { margin-top: 7px; color: var(--muted); font-size: 12px; }

        .sponsor-link {
            display: inline-flex;
            width: fit-content;
            margin-top: 22px;
            padding: 8px 12px;
            border: 1px solid rgba(131, 217, 189, .25);
            border-radius: 10px;
            color: var(--accent);
            font-size: 13px;
            transition: background .18s ease;
        }

        .sponsor-link:hover { background: rgba(131, 217, 189, .11); }

        footer {
            margin-top: 38px;
            color: #66717f;
            font-size: 12px;
            line-height: 1.8;
            text-align: center;
        }

        @media (max-width: 760px) {
            .shell { width: min(100% - 28px, 560px); padding-top: 36px; }
            .sponsor-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <main class="shell">
        <header class="hero">
            <p class="eyebrow">CheryTools Community</p>
            <h1>感谢每一份支持</h1>
            <p>
                CheryTools 的持续开发离不开社区成员的鼓励与支持。
                这里记录已经获得授权展示的赞助者，并为赞助者提供对应的专属功能。
            </p>
        </header>

        <section aria-labelledby="sponsors-title">
            <div class="section-head">
                <h2 id="sponsors-title">赞助者</h2>
                <span id="registry-meta" class="section-note">感谢你们让项目继续前进</span>
            </div>
            <div id="sponsor-list" class="sponsor-grid" aria-live="polite"></div>
        </section>

        <footer>
            CheryTools · A Dance of Fire and Ice 社区工具
        </footer>
    </main>
    <script src="./sponsors.js"></script>
</body>
</html>
